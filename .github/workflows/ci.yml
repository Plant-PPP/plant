name: CI

# The push trigger re-validates the exact SHA that landed on staging: PR runs
# test a merge preview, so two PRs that are green in isolation can still break
# in combination once both land.
on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]

# A new push to a PR cancels that PR's stale run. Staging push runs each get a
# group of their own, so every landed SHA is validated.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # fetch-depth 0 brings every branch, the PR base included, so no later
      # step needs the token.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # PR runs diff against the PR's base branch; push runs diff against the
      # previous staging head. A degenerate push base (branch creation, a head
      # force-pushed out of history) falls back to the root commit, which makes
      # every diff select everything: the run degrades to run-all, never to
      # run-nothing.
      - name: Resolve diff base
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            candidate="${{ github.event.before }}"
          else
            candidate="origin/${{ github.base_ref }}"
          fi
          if [ -n "$candidate" ] && [ "$candidate" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$candidate^{commit}" 2>/dev/null; then
            echo "ref=$candidate" >> "$GITHUB_OUTPUT"
            echo "range=$candidate..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No usable diff base ('$candidate'), falling back to the root commit, which runs everything."
            echo "ref=$(git rev-list --max-parents=0 HEAD | head -n 1)" >> "$GITHUB_OUTPUT"
            # <root>..HEAD would leave the root commit itself unscanned.
            echo "range=HEAD" >> "$GITHUB_OUTPUT"
          fi

      # The repo is public. The word list is a secret so it is never spelled
      # out in the repo. Secrets do not reach fork or Dependabot PRs, so only
      # those may skip; everywhere else a missing secret fails the run. It runs
      # before any other script from the branch so none can tamper with the
      # tools it calls. It only guards against leaking the word by accident:
      # anyone who can push a branch can also edit this workflow and read the
      # secret.
      - name: No forbidden words in files, names, commits or branch
        env:
          FORBIDDEN_WORDS: ${{ secrets.FORBIDDEN_WORDS }}
          REQUIRE_FORBIDDEN_WORDS: ${{ (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && '1' || '' }}
          FORBIDDEN_WORDS_RANGE: ${{ steps.base.outputs.range }}
          FORBIDDEN_WORDS_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/check-forbidden-words.sh

      # Needs only the checked-out tree, so it runs before anything expensive.
      - name: Every actions/checkout sets persist-credentials
        run: python3 .github/scripts/check-checkout-persist-credentials.py

      # A green gate run prints "ok" and proves nothing about the parser itself,
      # so the parser gets its own fixtures.
      - name: Checkout-credentials gate self-test
        run: python3 .github/scripts/check_checkout_persist_credentials_test.py

      - name: Setup pnpm
        # Version is read from the root package.json "packageManager" field.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Package boundaries
        run: pnpm check:boundaries

      - name: Check formatting
        run: LINTING_STAGING_REF="${{ steps.base.outputs.ref }}" bash scripts/formatting/ci-format-check.sh

      # Keys are per-commit, so each run starts from the nearest previous
      # cache. Saves from PR runs stay scoped to that PR; push runs seed the
      # staging scope every PR restores from.
      - name: Restore turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: |
            turbo-

      # `check` is the aggregate task in turbo.json (typecheck + lint).
      - name: Typecheck and lint (affected)
        env:
          TURBO_SCM_BASE: ${{ steps.base.outputs.ref }}
        run: pnpm exec turbo run check --affected --cache-dir=.turbo

      - name: Test (affected)
        env:
          TURBO_SCM_BASE: ${{ steps.base.outputs.ref }}
        run: pnpm exec turbo run test --affected --cache-dir=.turbo

  # Every PR and push: the new-migration checks and script tests, then a fresh
  # local Postgres with every migration applied, the types check and pgTAP. On
  # PRs, last, the append-only check.
  database:
    # The staging ruleset requires a check with this name.
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}
    outputs:
      migrations: ${{ steps.migrations.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # deploy-migrations, and the approval it asks for, runs only on a push
      # that touches supabase/migrations/. An unusable base counts as a change.
      - name: Does this push change migrations
        id: migrations
        if: github.event_name == 'push'
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null && git diff --quiet "$BASE" HEAD -- supabase/migrations/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        # Version is read from the root package.json "packageManager" field.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # The push run repeats it because two PRs green on their own can land out of
      # order, and deploy-migrations needs this job.
      - name: New migrations (name, version, transaction, squawk)
        run: bash scripts/check-migrations.sh "$BASE"

      - name: Script tests (squawk config, migration checks)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:scripts

      # `db start` boots only Postgres with every migration applied; the full
      # stack pulls images for services nothing below uses. It runs even when
      # the migration checks failed, so one push reports whether they apply.
      - name: Start Supabase database
        id: db
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec supabase db start

      - name: Check Supabase types are up to date
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: |
          bash scripts/check-supabase-types.sh || {
            rc=$?
            if [ "$rc" -eq 1 ]; then
              echo "::error::Supabase types are out of date. Run 'pnpm db:generate:supabase-types' locally and commit the changes."
            fi
            exit "$rc"
          }

      # Runs even when the types check failed, so one push reports both.
      # plpgsql_check runs inside the suite (schema_rls_and_grants_test.sql).
      - name: DB behavior tests (pgTAP)
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: pnpm exec supabase test db --local

      # Deployed databases never re-run an applied migration, so an edited one
      # would only change fresh databases. Corrections go in a new, later
      # migration. On a push the change already landed; the PR is where it can
      # be stopped. It runs last so a PR that breaks it on purpose (procedure 1
      # in the PLA-11 entry of docs/decisiones.md) still shows the rest of the
      # job.
      - name: Merged migrations are append-only
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          set -o pipefail
          mutated="$(git -c core.quotePath=false diff --name-status --find-renames --diff-filter=MDRCT "$BASE...HEAD" -- supabase/migrations/)"
          if [ -n "$mutated" ]; then
            echo "::error::Merged migrations are append-only, fix forward in a new migration:"
            echo "$mutated"
            exit 1
          fi

  # Push-only, no workflow_dispatch: a dispatch from another branch would apply
  # its migrations, which are recorded and never re-run.
  deploy-migrations:
    name: Deploy migrations to plant-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging' && needs.database.outputs.migrations == 'true'
    needs: [database]
    runs-on: ubuntu-latest
    environment: supabase-staging
    timeout-minutes: 15
    concurrency:
      group: supabase-staging-migrations
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned Supabase CLI version
        run: |
          version="$(jq -r '.devDependencies.supabase' package.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::package.json must pin supabase exactly, got '$version'"; exit 1; }
          echo "SUPABASE_CLI_VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Push pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_TELEMETRY_DISABLED: "1"
          # The CLI also reads these from committed .env files; the shell wins.
          SUPABASE_DB_MIGRATIONS_ENABLED: "true"
          PGSSLMODE: require
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::SUPABASE_DB_URL is not set in the supabase-staging environment"; exit 1; }
          # Migrations only: no Vault secrets from config.toml, and no prompt.
          supabase db push --db-url "$SUPABASE_DB_URL" --skip-vault --yes
