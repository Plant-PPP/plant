name: Forbidden words

# Every branch is public as soon as it is pushed, PR or not, and ci.yml only
# runs for PRs and staging. This job scans each push to any other branch; no
# cancel-in-progress, so commits force-pushed away were still scanned.
on:
  push:
    branches-ignore: [staging]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # New branch (before is all zeros): scan from where it left staging, or
      # all history when it shares none.
      # Same range policy as scripts/hooks/pre-push.sh; change both.
      - name: Resolve range
        id: range
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "range=$BEFORE..HEAD" >> "$GITHUB_OUTPUT"
          elif base=$(git merge-base HEAD origin/staging 2>/dev/null); then
            echo "range=$base..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "range=HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: No forbidden words in files, names, commits or branch
        env:
          FORBIDDEN_WORDS: ${{ secrets.FORBIDDEN_WORDS }}
          REQUIRE_FORBIDDEN_WORDS: ${{ github.actor != 'dependabot[bot]' && '1' || '' }}
          FORBIDDEN_WORDS_RANGE: ${{ steps.range.outputs.range }}
          FORBIDDEN_WORDS_BRANCH: ${{ github.ref_name }}
        run: bash scripts/check-forbidden-words.sh
