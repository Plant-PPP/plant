<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <title>Tu código para entrar a Plant</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f4f5">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f4f4f5"
    >
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width: 520px"
          >
            <tr>
              <td
                style="
                  background-color: #ffffff;
                  border-radius: 12px;
                  padding: 36px 40px;
                  font-family:
                    -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                    Roboto, Helvetica, Arial, sans-serif;
                  color: #09090b;
                "
              >
                <img
                  src="{{ .SiteURL }}/brand/logotipo-mail.png"
                  width="104"
                  height="34"
                  alt="Plant"
                  style="
                    display: block;
                    border: 0;
                    outline: none;
                    text-decoration: none;
                  "
                />
                <h1
                  style="
                    margin: 32px 0 0;
                    font-size: 24px;
                    line-height: 32px;
                    font-weight: 600;
                    letter-spacing: -0.01em;
                    color: #09090b;
                  "
                >
                  Tu código para entrar a Plant
                </h1>
                <p
                  style="
                    margin: 16px 0 0;
                    font-size: 16px;
                    line-height: 24px;
                    color: #3f3f46;
                  "
                >
                  Escribí este código en la pantalla de ingreso:
                </p>
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="margin-top: 20px"
                >
                  <tr>
                    <td
                      align="center"
                      style="
                        background-color: #f4f7f3;
                        border: 1px solid #d4e2d0;
                        border-radius: 10px;
                        padding: 22px 12px;
                        font-family:
                          &quot;Geist Mono&quot;, ui-monospace, SFMono-Regular,
                          Menlo, Consolas, monospace;
                        font-size: 36px;
                        line-height: 40px;
                        font-weight: 700;
                        letter-spacing: 0.3em;
                        color: #09090b;
                      "
                    >
                      {{ .Token }}
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 20px 0 0;
                    font-size: 16px;
                    line-height: 24px;
                    color: #3f3f46;
                  "
                >
                  El código vence en 10 minutos.
                </p>
                <p
                  style="
                    margin: 16px 0 0;
                    font-size: 14px;
                    line-height: 22px;
                    color: #71717a;
                  "
                >
                  Si no lo pediste, ignorá este mail.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px 8px 0;
                  font-family:
                    -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                    Roboto, Helvetica, Arial, sans-serif;
                  font-size: 13px;
                  line-height: 20px;
                  color: #71717a;
                "
              >
                © 2026 Plant. Este mail es automático, no hace falta
                responderlo.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
