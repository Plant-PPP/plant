packages:
  - "apps/*"
  - "packages/*"
  - "evals"
  - "security-tests"

# One version of these across the monorepo. Inngest is pinned exactly: the
# endpoint in apps/web and the orchestrators in packages/jobs must serve the
# same SDK, or the functions registered with Inngest drift from the code.
catalog:
  "@supabase/supabase-js": ^2.117.3
  "@types/jest": ^30.0.0
  "@types/node": ^26.6.5
  eslint: ^10.12.0
  inngest: 4.24.0
  jest: ^30.5.2
  ts-jest: ^29.4.14
  typescript: ^5.9.3
  typescript-eslint: ^8.71.2
  zod: ^4.6.7

# Patched versions of dependencies that CI's `pnpm audit` flags. Drop each
# one once its parent (inngest-cli, concurrently, @ai-sdk/provider-utils)
# ships the fix.
overrides:
  adm-zip: ^0.6.1
  shell-quote: ^1.11.0
  "@ai-sdk/provider-utils>undici": ^6.29.1

auditConfig:
  ignoreGhsas:
    # braces (via eslint-config-next): no patched release exists. Only lint
    # reaches it, with glob patterns from this repo.
    - GHSA-vfj7-8cjw-p6xm
    # sprintf-js (via jest's transform): no patched release
    # exists. Only the test runner reaches it, with this repo's own strings.
    - GHSA-hp3w-g68c-fv3c

onlyBuiltDependencies:
  - esbuild
  - inngest-cli
  - supabase
  - sharp
  - unrs-resolver
